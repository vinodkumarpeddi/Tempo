name: Report cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping report endpoint
        run: |
          curl -fsS --max-time 60 \
            "https://brimly.vercel.app/api/cron/daily?secret=${{ secrets.CRON_SECRET }}"
